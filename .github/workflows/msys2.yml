name: msys2

on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+'
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
  # so a lane can be re-run against a tip that has not moved -- what is
  # wanted when the runner's platform changed underneath it, or when a
  # push landed before the workflows were registered and triggered none
  workflow_dispatch:

jobs:
  test:
    strategy:
      # one run reports every lane: a red lane hides the others otherwise,
      # and a backlog is then found one failure per run
      fail-fast: false
      matrix:
        config:
          # qpdf, which the pdf-consumer test hands the written document
          # to, is installed on one lane only, so the structural reading
          # is made on mingw64 and the other lane says in its log that it
          # is not making it. Which lanes carry the reader is named here
          # rather than inferred, so that the step below can hold each one
          # to its own answer.
          #
          # The base 35 fonts are packaged for one environment, so that
          # lane installs them and the other resolves the standard names
          # against the faces the host itself carries, which fontconfig
          # reads on this platform. Both lanes are held to resolving them
          # either way: the tests run on both, and a name that reaches no
          # face raises invalidfont wherever it is named.
          #
          # Both lanes are mingw64. The lane without the reader and the
          # fonts was mingw32 until MSYS2 stopped packaging fontconfig
          # for it -- clang32 is empty too, so no 32-bit environment
          # there can build this, and the pointer-and-long widths a
          # 32-bit build would have exercised are not covered on this
          # platform. It is not ucrt64 either: resetfile discards a
          # stream's read-ahead through fflush, which the MSVCRT runtime
          # these lanes build against does and the UCRT does not.
          - lane: bare
            msystem: mingw64
            reader: none
            install: base-devel git mingw-w64-x86_64-toolchain mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-libpng mingw-w64-x86_64-freetype mingw-w64-x86_64-fontconfig mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
          - lane: full
            msystem: mingw64
            reader: qpdf
            install: base-devel git mingw-w64-x86_64-toolchain mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-libpng mingw-w64-x86_64-freetype mingw-w64-x86_64-fontconfig mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-qpdf mingw-w64-x86_64-gsfonts
        object: [small, large]
    name: msys2 - ${{ matrix.config.msystem }} ${{ matrix.config.lane }} - ${{ matrix.object }}-object
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@master
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.config.msystem }}
        update: true
        install: ${{ matrix.config.install }}
    # The pdf-consumer test skips where its reader is absent, and a skip
    # reads as a pass, so a lane that says it carries the reader is held
    # to it here: an install that stops carrying qpdf is red rather than
    # quiet, and a lane that carries none says so where the log records it.
    - name: PDF reader
      env:
        reader: ${{ matrix.config.reader }}
      run: |
        if [ "$reader" = qpdf ]; then
          qpdf --version
        else
          echo "no qpdf in this environment: the structural reading of the written PDF is not made on this lane"
        fi
    # Eighteen of the tests name one of the standard faces, and all but one
    # of those call sites take the face for granted. findfont reaches them
    # through fontconfig, which answers a machine carrying no fonts with
    # nothing at all, and the name then raises invalidfont: the runner is
    # held to carrying the faces rather than the tests to doing without
    # them. The query below is the one findfont makes.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    # Warnings are errors here as they are on the linux legs, in both
    # object widths. This leg is the only one that compiles the branches
    # written for this platform, so a diagnostic in one of them is raised
    # nowhere else -- the helper defined outside the condition its callers
    # carry, and the size printed through a conversion for a narrower
    # type, were both reported here and by no other leg.
    - name: meson
      run: meson setup -Dlarge-object=${{ matrix.object == 'large' }} --werror builddir
    - name: meson test
      run: meson test -C builddir --print-errorlogs
