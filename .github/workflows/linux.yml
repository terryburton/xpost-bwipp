name: linux CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]
  # so a lane can be re-run against a tip that has not moved -- what is
  # wanted when the runner's platform changed underneath it, or when a
  # push landed before the workflows were registered and triggered none
  workflow_dispatch:

jobs:
  build:
    strategy:
      # one run reports every lane: a red lane hides the others otherwise,
      # and a backlog is then found one failure per run
      fail-fast: false
      matrix:
        object: [small, large]
        # Virtual memory is backed by a mapping grown with mremap or by
        # the allocator, and the two take different arms of the memory
        # file at every point where the arena is made, grown and
        # released. Both are built and both run the suite: whichever
        # were left out would be compiled by no lane, and the arms it
        # holds would go stale without anything saying so.
        backing: [mapped, allocator]
    name: linux - ${{ matrix.object }}-object, ${{ matrix.backing }} memory
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt-get -qq update
        sudo apt install -y build-essential libpng-dev libjpeg-dev libfreetype6-dev libfontconfig1-dev fontconfig fonts-urw-base35 meson ninja-build qpdf
    # qpdf is what the pdf-consumer test hands the written document to, and
    # that test skips where it is absent. A skip reads as a pass, so the
    # reader's presence is asserted here rather than left to the test to
    # discover: a lane whose install stops carrying it is red, not quiet.
    - name: PDF reader
      run: qpdf --version
    # Eighteen of the tests name one of the standard faces, and all but one
    # of those call sites take the face for granted. findfont reaches them
    # through fontconfig, which answers a machine carrying no fonts with
    # nothing at all, and the name then raises invalidfont: the runner is
    # held to carrying the faces rather than the tests to doing without
    # them. The base 35 are what the names mean, so they are what is
    # installed, and the query below is the one findfont makes.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    # Warnings are errors on this leg, in both object widths and both
    # backings, as they are on the osx and msys2 legs. Each platform
    # raises what the others cannot: a definition compiled into every
    # build but called from only some of them is dead weight on exactly
    # one of them, and a branch written for one platform is compiled
    # nowhere else. A leg that reports such a thing without stopping for
    # it reports it to nobody.
    #
    # What promoting everywhere costs is that a diagnostic whose set the
    # platform decides now stops a build rather than filling a log. The
    # clearest is the attribute behind -Wunused-result: the interpreter
    # puts XPOST_MUST_CHECK on the functions whose refusal a caller has to
    # read, and each C library puts it on a set of declarations it chooses
    # for itself, so the calls it fires on are not the same set on every
    # runner. Each leg was built clean at both widths on a host of its own
    # platform before this was asked of it.
    #
    # Both widths take it, and that is the point of saying so here. word
    # is an unsigned short in the default build and an unsigned int under
    # large-object, so a diagnostic only one width can raise is otherwise
    # answered by whichever width happened to be asked, and the other leg
    # compiles what this one would have refused.
    - name: meson
      run: meson setup -Dlarge-object=${{ matrix.object == 'large' }} -Dmmap=${{ matrix.backing == 'mapped' }} --werror builddir
    # The option asks for a backing; the configuration decides one, and on
    # a host without mremap it decides the allocator whatever was asked.
    # A lane that quietly configured the other backing would report a
    # green run for arms it never compiled, so what was asked for is held
    # against what config.h says.
    - name: the memory backing is the one this lane is for
      run: |
        if [ "${{ matrix.backing }}" = mapped ]; then want=1; else want=0; fi
        got=$(grep -c '^#define HAVE_MREMAP' builddir/config.h || true)
        [ "$got" = "$want" ] || {
          echo "asked for the ${{ matrix.backing }} backing;"
          echo "config.h defines HAVE_MREMAP $got time(s), wanted $want"
          exit 1
        }
        echo "${{ matrix.backing }}: as configured"
    - name: ninja
      run: ninja -C builddir
    - name: meson test
      run: meson test -C builddir --print-errorlogs
    - name: meson dist
      run: meson dist -C builddir

  # The faceless configuration: -Dfreetype=disabled builds a font system
  # with no faces, whose findfont answers invalidfont while procedural
  # (Type 3) fonts still render. No lane built the optional
  # configuration the tree used to describe, which is how it rotted
  # into one that did not compile; this lane exists so that cannot
  # happen again. It is the smallest job that holds the configuration:
  # one width, built under -Werror because the way this configuration
  # failed before was helpers left defined and unused, and the fast
  # suite, in which the face-backed tests skip loudly and the
  # noface-refusal suite runs. Freetype, fontconfig and the fonts are
  # deliberately not installed: the lane holds the build that genuinely
  # lacks them.
  nofaces:
    name: linux - no face library
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        sudo apt-get -qq update
        sudo apt install -y build-essential libpng-dev libjpeg-dev meson ninja-build
    - name: meson
      run: meson setup -Dfreetype=disabled --werror builddir
    # The option asks for the faceless build; what was configured is held
    # to what config.h says, so a lane that quietly found a face library
    # cannot report green for a configuration it never compiled.
    - name: the build carries no face library
      run: |
        if grep -q '^#define HAVE_FREETYPE2' builddir/config.h; then
          echo "asked for no face library; config.h defines HAVE_FREETYPE2"
          exit 1
        fi
        echo "no face library: as configured"
    - name: ninja
      run: ninja -C builddir
    - name: meson test
      run: meson test -C builddir --suite fast --print-errorlogs
