name: osx CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]
  # so a lane can be re-run against a tip that has not moved -- what is
  # wanted when the runner's platform changed underneath it, or when a
  # push landed before the workflows were registered and triggered none
  workflow_dispatch:

jobs:
  build:
    strategy:
      # one run reports every lane: a red lane hides the others otherwise,
      # and a backlog is then found one failure per run
      fail-fast: false
      matrix:
        object: [small, large]
    name: osx - ${{ matrix.object }}-object
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        brew install meson ninja fontconfig freetype libpng jpeg-turbo xcb-util xcb-util-image xcb-util-wm qpdf
        brew install --cask font-urw-base35
    # qpdf is what the pdf-consumer test hands the written document to, and
    # that test skips where it is absent. A skip reads as a pass, so the
    # reader's presence is asserted here rather than left to the test to
    # discover: a lane whose install stops carrying it is red, not quiet.
    - name: PDF reader
      run: qpdf --version
    # Eighteen of the tests name one of the standard faces, and all but one
    # of those call sites take the face for granted. findfont reaches them
    # through fontconfig, which answers a machine carrying no fonts with
    # nothing at all, and the name then raises invalidfont: the runner is
    # held to carrying the faces rather than the tests to doing without
    # them. The base 35 are what the names mean, so they are what is
    # installed, and the query below is the one findfont makes.
    - name: Fonts
      run: |
        for face in Helvetica Times Courier Symbol; do
          file=$(fc-match -f '%{file}' "$face")
          [ -n "$file" ] || { echo "no face answers to $face"; exit 1; }
          echo "$face -> $file"
        done
    # Warnings are errors here as they are on the linux legs, in both
    # object widths. This leg reports what the others cannot: the two
    # definitions compiled into every build and called from only some of
    # them were each raised by exactly one platform, and one of them by
    # this one alone. A diagnostic only one platform can raise is worth
    # nothing if that platform is the one that does not stop for it.
    - name: configure
      run: meson setup -Dlarge-object=${{ matrix.object == 'large' }} --werror builddir
    - name: make
      run: ninja -C builddir
    - name: meson test
      run: meson test -C builddir --print-errorlogs
